<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AltMusic - Contacts</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Poppins:wght@600;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <input type="checkbox" id="mode" class="mode-toggle" aria-label="Light mode">

  <div class="layout">
    <aside class="sidebar">
      <div class="brand-row">
        <a class="brand" href="index.html"><img src="images/Logo1.png" alt="" width="32" height="32"><div><span>alt</span>music</div></a>
        <label class="toggle" for="mode" title="Switch light/dark mode" aria-label="Switch light/dark mode"><span class="sun-icon">☀</span><span class="moon-icon">☾</span></label>
      </div>

      <nav><a href="index.html">Home</a><a href="about.html">About Us</a><a href="library.html">Library</a><a href="faq.html">FAQs</a><a href="contact.html" aria-current="page">Contact Us</a><a href="premium.html">Premium</a></nav>
    </aside>

    <main>
      <section class="centered">
        <h1>Contact Us</h1>
        <p style="margin-top:16px">Have a question, some feedback, or just want to say hello? Send us a message and we will get back to you by email as soon as we can.</p>
        <form action="#" method="post">
          <label>Name <input type="text" name="name" required></label>
          <label>Email <input type="email" name="email" required></label>
          <label>Message <textarea name="message" required></textarea></label>
          <button class="btn" type="submit">Send message</button>
        </form>
      </section>
      
      <footer>&copy; 2026 altmusic. All rights reserved.</footer>
    </main>
  </div>
</body>
</html>
